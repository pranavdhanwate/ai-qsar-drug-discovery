[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-qsar-drug-discovery"
version = "1.0.0"
description = "Machine learning models for molecular property prediction and bioactivity estimation with OECD applicability domain verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9.1",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
